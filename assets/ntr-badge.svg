<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <!-- Golden background circle -->
  <circle cx="110" cy="110" r="90" fill="#FBBF24" stroke="#F59E0B" stroke-width="4"/>
  <!-- Sunburst rays -->
  <g stroke="#FDE68A" stroke-width="3" opacity="0.6">
    <line x1="110" y1="20" x2="110" y2="40"/>
    <line x1="110" y1="180" x2="110" y2="200"/>
    <line x1="20" y1="110" x2="40" y2="110"/>
    <line x1="180" y1="110" x2="200" y2="110"/>
    <line x1="45" y1="45" x2="60" y2="60"/>
    <line x1="160" y1="160" x2="175" y2="175"/>
    <line x1="45" y1="175" x2="60" y2="160"/>
    <line x1="160" y1="60" x2="175" y2="45"/>
  </g>
  <!-- Inner White Circle -->
  <circle cx="110" cy="110" r="68" fill="#FFFFFF" stroke="#10B981" stroke-width="4"/>
  <!-- Medical Cross & NTR Stylized Icon -->
  <path d="M 98,65 H 122 V 155 H 98 Z M 65,98 H 155 V 122 H 65 Z" fill="#EF4444" opacity="0.9"/>
  <!-- Top Curved Text -->
  <path id="ntrTextPath" d="M 40,110 A 70,70 0 0,1 180,110" fill="none" stroke="none"/>
  <text font-family="'Poppins', sans-serif" font-size="10" font-weight="800" fill="#991B1B">
    <textPath href="#ntrTextPath" startOffset="50%" text-anchor="middle">
      డా॥ ఎన్.టి.ఆర్ వైద్యసేవ
    </textPath>
  </text>
  <!-- Bottom Ribbon -->
  <path d="M 20,165 L 45,150 L 175,150 L 200,165 L 185,185 L 110,175 L 35,185 Z" fill="#DC2626"/>
  <text x="110" y="170" font-family="'Nunito', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    పేదలందరికి ఆధునిక వైద్యం
  </text>
  <text x="110" y="198" font-family="'Poppins', sans-serif" font-size="10" font-weight="800" fill="#1E293B" text-anchor="middle">
    NTR &amp; E.H.S SCHEME
  </text>
</svg>