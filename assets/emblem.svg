<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Outer circle with Blue border -->
  <circle cx="150" cy="150" r="142" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="8"/>
  <circle cx="150" cy="150" r="133" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6,4"/>
  
  <!-- Curved text around top -->
  <path id="textPathTop" d="M 38,150 A 112,112 0 0,1 262,150" fill="none" stroke="none"/>
  <text font-family="'Poppins', sans-serif" font-size="13.5" font-weight="800" fill="#1E3A8A" letter-spacing="1.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      NIZAM'S LITTLE STAR CHILDREN HOSPITAL
    </textPath>
  </text>

  <!-- Golden Star on top -->
  <polygon points="150,65 155,78 168,78 157,86 161,98 150,90 139,98 143,86 132,78 145,78" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
  
  <!-- Blue Wings spreading horizontally -->
  <g fill="#2563EB">
    <path d="M 150,118 Q 110,105 60,118 Q 100,128 150,128 Z"/>
    <path d="M 150,126 Q 115,120 72,132 Q 110,138 150,136 Z"/>
    <path d="M 150,134 Q 120,132 88,144 Q 120,148 150,144 Z"/>
    <path d="M 150,118 Q 190,105 240,118 Q 200,128 150,128 Z"/>
    <path d="M 150,126 Q 185,120 228,132 Q 190,138 150,136 Z"/>
    <path d="M 150,134 Q 180,132 212,144 Q 180,148 150,144 Z"/>
  </g>

  <!-- Central Staff / Rod -->
  <rect x="146" y="88" width="8" height="150" rx="4" fill="#0F172A"/>
  <circle cx="150" cy="88" r="6" fill="#F59E0B"/>

  <!-- Twin Coiled Serpents (Caduceus) in Blue/Dark -->
  <path d="M 150,105 Q 175,115 175,130 Q 175,145 150,155 Q 125,165 125,180 Q 125,195 150,205 Q 175,215 175,230" 
        fill="none" stroke="#1D4ED8" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 150,105 Q 125,115 125,130 Q 125,145 150,155 Q 175,165 175,180 Q 175,195 150,205 Q 125,215 125,230" 
        fill="none" stroke="#0F172A" stroke-width="6.5" stroke-linecap="round"/>
        
  <!-- Bottom Star Accent -->
  <polygon points="150,250 153,257 160,257 154,261 156,268 150,264 144,268 146,261 140,257 147,257" fill="#F59E0B"/>
</svg>