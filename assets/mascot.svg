<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <!-- Star Body in Golden Yellow -->
  <polygon points="100,18 116,62 165,62 126,88 141,133 100,108 59,133 74,88 35,62 84,62" fill="#F59E0B" stroke="#D97706" stroke-width="2.5"/>
  <!-- Eyes -->
  <circle cx="85" cy="70" r="6.5" fill="#0F172A"/>
  <circle cx="115" cy="70" r="6.5" fill="#0F172A"/>
  <circle cx="87" cy="68" r="2.2" fill="#FFFFFF"/>
  <circle cx="117" cy="68" r="2.2" fill="#FFFFFF"/>
  <!-- Smile -->
  <path d="M 87 83 Q 100 96 113 83" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cheeks in Soft Amber -->
  <ellipse cx="77" cy="80" rx="8" ry="5" fill="#FBBF24" opacity="0.8"/>
  <ellipse cx="123" cy="80" rx="8" ry="5" fill="#FBBF24" opacity="0.8"/>
  <!-- Doctor White Coat with Blue Lapels -->
  <rect x="70" y="108" width="60" height="70" rx="14" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <!-- Stethoscope in Blue & Yellow -->
  <path d="M 90 122 Q 100 138 110 122" stroke="#1D4ED8" stroke-width="3" fill="none"/>
  <circle cx="100" cy="140" r="7.5" fill="#FEF3C7" stroke="#1D4ED8" stroke-width="2.5"/>
  <!-- Left Arm -->
  <path d="M 70 118 Q 45 128 50 148" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Right Arm (Waving) -->
  <path d="M 130 118 Q 155 128 150 148" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none" id="mascot-arm"/>
  <!-- Hands -->
  <circle cx="50" cy="151" r="8" fill="#FDE68A"/>
  <circle cx="150" cy="151" r="8" fill="#FDE68A"/>
  <!-- Legs in Blue -->
  <rect x="80" y="176" width="16" height="30" rx="8" fill="#1D4ED8"/>
  <rect x="104" y="176" width="16" height="30" rx="8" fill="#1D4ED8"/>
  <!-- Shoes in Deep Navy -->
  <ellipse cx="88" cy="206" rx="12" ry="7" fill="#0F172A"/>
  <ellipse cx="112" cy="206" rx="12" ry="7" fill="#0F172A"/>
</svg>